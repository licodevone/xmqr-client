[package]
name = "xmqr-client"
version = "0.33.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Cliente CLI MQTT 3.1.1 independente, originado do XMQR"
readme = "README.md"

[[bin]]
name = "mqtt-client"
path = "src/main.rs"

[dependencies]
fs2 = "0.4.3"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
toml = "0.9.8"
rpassword = "7.5.4"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rumqttc = { version = "=0.25.1", default-features = false, features = ["use-rustls-no-provider", "websocket"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"

[patch.crates-io]
rumqttc = { path = "vendor/rumqttc-0.25.1" }

[dev-dependencies]
bytes = "1.10.1"
tempfile = "3.27.0"
tungstenite = "0.26.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
