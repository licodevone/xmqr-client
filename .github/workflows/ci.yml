name: CI
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: C140-C142 five MQTT 5 audit corrections and controls
        run: python3 -B scripts/verify_mqtt5_audit_fixes.py --client target/debug/mqtt-client --report dist/c140-ci-audit-fixes.json
      - name: C144 four MQTT 5 receiving recommendations and controls
        run: python3 -B scripts/verify_mqtt5_receive_validation.py --client target/debug/mqtt-client --report dist/c144-ci-receive-validation.json
      - name: C129 inbound journal (all 21 cases) and compatibility
        run: |
          python3 -B -m unittest discover -s scripts -p test_c129_harness.py -v
          python3 -B scripts/verify_subscription_inbound_journal_mqtt5.py --client target/debug/mqtt-client --report dist/c129-ci-inbound.json
          python3 -B scripts/verify_c129_compatibility.py --client target/debug/mqtt-client --report dist/c129-ci-compatibility.json
      - name: C129 actual draft-v1 to v2 migration
        run: |
          mkdir -p "$RUNNER_TEMP/c129-legacy"
          git archive 235f20d097b674fadcbdf85d8c8f1c581ff1eba9 | tar -x -C "$RUNNER_TEMP/c129-legacy"
          cargo build --locked --bin mqtt-client --manifest-path "$RUNNER_TEMP/c129-legacy/Cargo.toml" --target-dir "$RUNNER_TEMP/c129-legacy-target"
          python3 -B scripts/test_c131_migration_cleanup.py --legacy-client "$RUNNER_TEMP/c129-legacy-target/debug/mqtt-client" --client target/debug/mqtt-client
          python3 -B scripts/verify_c129_v1_migration.py --legacy-client "$RUNNER_TEMP/c129-legacy-target/debug/mqtt-client" --client target/debug/mqtt-client --report dist/c129-ci-v1-migration.json
      - run: python3 -B scripts/verify_wss_client.py
      - run: python3 -B scripts/verify_wss_durable_subscription.py
      - run: python3 scripts/verify_subscription_user_properties_mqtt5.py
      - run: python3 scripts/verify_disconnect_session_expiry_mqtt5.py
      - run: python3 scripts/verify_durable_qos1_outbox_mqtt5.py
      - run: python3 scripts/verify_durable_qos2_outbox_mqtt5.py
      - run: python3 scripts/verify_durable_subscription_mqtt5.py
      - run: python3 scripts/verify_subscription_ack_after_output_mqtt5.py
      - run: python3 scripts/license_inventory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c129-fixture-reports
          path: dist/c129-ci-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c140-audit-fix-report
          path: dist/c140-ci-audit-fixes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c144-receive-validation-report
          path: dist/c144-ci-receive-validation.json

  ubuntu-package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git curl ca-certificates build-essential cmake perl pkg-config python3 dpkg-dev systemd
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/build_deb.py
      - run: curl -fsSL https://github.com/licodevone/xmqr-client/releases/download/v0.42.1/xmqr-client_0.42.1-1_amd64.deb -o /tmp/xmqr-client_0.42.1-1_amd64.deb
      - run: echo 'c6a1356e5eaefda6be2f18abb5dd5fafe4865c166346a6fc57002cd99cedfb7c  /tmp/xmqr-client_0.42.1-1_amd64.deb' | sha256sum -c -
      - run: apt-get install -y /tmp/xmqr-client_0.42.1-1_amd64.deb && test "$(mqtt-client --version)" = 'mqtt-client 0.42.1' && test "$(mqtt-bridge --version)" = 'mqtt-bridge 0.4.0 (xmqr-client 0.42.1)' && printf 'keep\n' >/etc/xmqr-client/operator.keep
      - run: apt-get install -y ./dist/*.deb
      - run: test "$(mqtt-client --version)" = 'mqtt-client 0.43.0' && test "$(mqtt-bridge --version)" = 'mqtt-bridge 0.5.0 (xmqr-client 0.43.0)'
      - run: systemd-analyze verify /usr/lib/systemd/system/xmqr-client-sub@.service /usr/lib/systemd/system/xmqr-client-pub@.service /usr/lib/systemd/system/xmqr-client-bridge@.service
      - run: test "$(cat /etc/xmqr-client/operator.keep)" = keep && test ! -e /etc/systemd/system/multi-user.target.wants/xmqr-client-bridge@lab.service
      - run: apt-get install -y --allow-downgrades /tmp/xmqr-client_0.42.1-1_amd64.deb && test "$(mqtt-client --version)" = 'mqtt-client 0.42.1' && test "$(mqtt-bridge --version)" = 'mqtt-bridge 0.4.0 (xmqr-client 0.42.1)' && test "$(cat /etc/xmqr-client/operator.keep)" = keep
      - run: apt-get install -y ./dist/*.deb && test "$(mqtt-bridge --version)" = 'mqtt-bridge 0.5.0 (xmqr-client 0.43.0)'
      - uses: actions/upload-artifact@v4
        with:
          name: xmqr-client-ubuntu26-amd64
          path: dist/*

  bridge-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: licodevone/xmqr
          ref: v0.43.0
          path: broker
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bins
      - run: cargo build --locked --bins --manifest-path broker/Cargo.toml
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --mqtt5-retain
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --mqtt5-retain
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --mqtt5-retain --qos1
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --mqtt5-retain --qos1
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --mqtt5-retain --qos2
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --mqtt5-retain --qos2
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --qos1
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --qos1
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --qos2
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --qos2
      - run: python3 scripts/verify_bridge_topology.py --broker-root broker
      - name: C147 multiple mappings and static diagnosis
        run: python3 -B scripts/verify_bridge_mappings.py --broker-root broker --report dist/c147-ci-mappings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c147-mapping-report
          path: dist/c147-ci-mappings.json

  bridge-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: licodevone/xmqr
          ref: v0.43.0
          path: broker
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bins
      - run: cargo build --locked --bins --manifest-path broker/Cargo.toml
      - run: docker pull eclipse-mosquitto:2.0.22
      - name: C148 wire properties acknowledgements and lifecycle
        run: |
          mkdir -p dist
          python3 -B scripts/verify_bridge_v5_wire.py --bridge target/debug/mqtt-bridge --broker-root broker --report dist/c148-ci-wire.json
      - name: C148 durable recovery and negative acknowledgements
        run: python3 -B scripts/verify_bridge_v5_crash.py --bridge target/debug/mqtt-bridge --broker-root broker --report dist/c148-ci-recovery.json
      - name: C148 actual brokers multi-route chain and cooperative return
        run: python3 -B scripts/verify_bridge_v5_brokers.py --bridge target/debug/mqtt-bridge --client target/debug/mqtt-client --broker-root broker --mosquitto eclipse-mosquitto:2.0.22 --report dist/c148-ci-brokers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c148-mqtt5-bridge
          path: dist/c148-ci-*.json

  bridge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=0.43.0 --build-arg VCS_REF=${{ github.sha }} -t xmqr-client:ci .
      - run: test "$(docker run --rm --entrypoint /usr/local/bin/mqtt-client xmqr-client:ci --version)" = 'mqtt-client 0.43.0'
      - run: test "$(docker run --rm --entrypoint /usr/local/bin/mqtt-bridge xmqr-client:ci --version)" = 'mqtt-bridge 0.5.0 (xmqr-client 0.43.0)'
      - run: test "$(docker image inspect xmqr-client:ci --format '{{.Config.User}}')" = '10001:10001'

  bridge-package-integration:
    needs: [ubuntu-package]
    runs-on: ubuntu-latest
    env:
      XMQR_CLIENT_BIN: ${{ github.workspace }}/dist/unpacked/usr/bin/mqtt-client
      XMQR_BRIDGE_BIN: ${{ github.workspace }}/dist/unpacked/usr/bin/mqtt-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: licodevone/xmqr
          ref: v0.43.0
          path: broker
      - uses: actions/download-artifact@v4
        with:
          name: xmqr-client-ubuntu26-amd64
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bins --manifest-path broker/Cargo.toml
      - run: mkdir -p dist/unpacked && dpkg-deb -x dist/xmqr-client_0.43.0-1_amd64.deb dist/unpacked
      - run: test "$($XMQR_CLIENT_BIN --version)" = 'mqtt-client 0.43.0' && test "$($XMQR_BRIDGE_BIN --version)" = 'mqtt-bridge 0.5.0 (xmqr-client 0.43.0)'
      - run: python3 -B scripts/verify_mqtt5_audit_fixes.py --client "$XMQR_CLIENT_BIN" --report dist/c140-package-audit-fixes.json
      - run: python3 -B scripts/verify_mqtt5_receive_validation.py --client "$XMQR_CLIENT_BIN" --report dist/c144-package-receive-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c140-package-audit-fix-report
          path: dist/c140-package-audit-fixes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c144-package-receive-validation-report
          path: dist/c144-package-receive-validation.json
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --qos2 --skip-crash-checkpoint
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --qos2
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --mqtt5-retain
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --mqtt5-retain
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --mqtt5-retain --qos1 --skip-crash-checkpoint
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --mqtt5-retain --qos1
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --mqtt5-retain --qos2 --skip-crash-checkpoint
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --mqtt5-retain --qos2
      - name: C148 wire contract on packaged ELF
        run: python3 -B scripts/verify_bridge_v5_wire.py --bridge "$XMQR_BRIDGE_BIN" --broker-root broker --report dist/c148-package-wire.json
      - name: C148 real brokers on packaged ELF
        run: python3 -B scripts/verify_bridge_v5_brokers.py --bridge "$XMQR_BRIDGE_BIN" --client "$XMQR_CLIENT_BIN" --broker-root broker --mosquitto eclipse-mosquitto:2.0.22 --report dist/c148-package-brokers.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c148-packaged-mqtt5-bridge
          path: dist/c148-package-*.json
