name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: python3 scripts/license_inventory.py --check

  ubuntu-package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git curl ca-certificates build-essential cmake perl pkg-config python3 dpkg-dev systemd
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/build_deb.py
      - run: apt-get install -y ./dist/*.deb
      - run: systemd-analyze verify /usr/lib/systemd/system/xmqr-client-sub@.service /usr/lib/systemd/system/xmqr-client-pub@.service
      - uses: actions/upload-artifact@v4
        with:
          name: xmqr-client-ubuntu26-amd64
          path: dist/*
