name: CI
on:
  push:
    branches: [main, 'release/**', 'feature/c134-bridge-qos2']
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: C129 inbound journal (all 21 cases) and compatibility
        run: |
          python3 -B -m unittest discover -s scripts -p test_c129_harness.py -v
          python3 -B scripts/verify_subscription_inbound_journal_mqtt5.py --client target/debug/mqtt-client --report dist/c129-ci-inbound.json
          python3 -B scripts/verify_c129_compatibility.py --client target/debug/mqtt-client --report dist/c129-ci-compatibility.json
      - name: C129 actual draft-v1 to v2 migration
        run: |
          mkdir -p "$RUNNER_TEMP/c129-legacy"
          git archive 235f20d097b674fadcbdf85d8c8f1c581ff1eba9 | tar -x -C "$RUNNER_TEMP/c129-legacy"
          cargo build --locked --bin mqtt-client --manifest-path "$RUNNER_TEMP/c129-legacy/Cargo.toml" --target-dir "$RUNNER_TEMP/c129-legacy-target"
          python3 -B scripts/test_c131_migration_cleanup.py --legacy-client "$RUNNER_TEMP/c129-legacy-target/debug/mqtt-client" --client target/debug/mqtt-client
          python3 -B scripts/verify_c129_v1_migration.py --legacy-client "$RUNNER_TEMP/c129-legacy-target/debug/mqtt-client" --client target/debug/mqtt-client --report dist/c129-ci-v1-migration.json
      - run: python3 -B scripts/verify_wss_client.py
      - run: python3 -B scripts/verify_wss_durable_subscription.py
      - run: python3 scripts/verify_subscription_user_properties_mqtt5.py
      - run: python3 scripts/verify_disconnect_session_expiry_mqtt5.py
      - run: python3 scripts/verify_durable_qos1_outbox_mqtt5.py
      - run: python3 scripts/verify_durable_qos2_outbox_mqtt5.py
      - run: python3 scripts/verify_durable_subscription_mqtt5.py
      - run: python3 scripts/verify_subscription_ack_after_output_mqtt5.py
      - run: python3 scripts/license_inventory.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c129-fixture-reports
          path: dist/c129-ci-*.json

  ubuntu-package:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git curl ca-certificates build-essential cmake perl pkg-config python3 dpkg-dev systemd
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: python3 scripts/build_deb.py
      - run: curl -fsSL https://github.com/licodevone/xmqr-client/releases/download/v0.38.0/xmqr-client_0.38.0-1_amd64.deb -o /tmp/xmqr-client_0.38.0-1_amd64.deb
      - run: echo 'a496e9e2e5887d7211a7e616b43a00e51c3d3afa63beb0f5d60f4c6dc492c90b  /tmp/xmqr-client_0.38.0-1_amd64.deb' | sha256sum -c -
      - run: apt-get install -y /tmp/xmqr-client_0.38.0-1_amd64.deb && test "$(mqtt-client --version)" = 'mqtt-client 0.38.0' && test ! -e /usr/bin/mqtt-bridge && printf 'keep\n' >/etc/xmqr-client/operator.keep
      - run: apt-get install -y ./dist/*.deb
      - run: test "$(mqtt-client --version)" = 'mqtt-client 0.39.0' && test "$(mqtt-bridge --version)" = 'mqtt-bridge 0.1.0 (xmqr-client 0.39.0)'
      - run: systemd-analyze verify /usr/lib/systemd/system/xmqr-client-sub@.service /usr/lib/systemd/system/xmqr-client-pub@.service /usr/lib/systemd/system/xmqr-client-bridge@.service
      - run: test "$(cat /etc/xmqr-client/operator.keep)" = keep && test ! -e /etc/systemd/system/multi-user.target.wants/xmqr-client-bridge@lab.service
      - run: apt-get install -y --allow-downgrades /tmp/xmqr-client_0.38.0-1_amd64.deb && test "$(mqtt-client --version)" = 'mqtt-client 0.38.0' && test ! -e /usr/bin/mqtt-bridge && test "$(cat /etc/xmqr-client/operator.keep)" = keep
      - run: apt-get install -y ./dist/*.deb && test "$(mqtt-bridge --version)" = 'mqtt-bridge 0.1.0 (xmqr-client 0.39.0)'
      - uses: actions/upload-artifact@v4
        with:
          name: xmqr-client-ubuntu26-amd64
          path: dist/*

  bridge-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: licodevone/xmqr
          ref: v0.42.0
          path: broker
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bins
      - run: cargo build --locked --bins --manifest-path broker/Cargo.toml
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --qos1
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --qos1
      - run: python3 scripts/verify_bridge_brokers.py --broker-root broker --qos2
      - run: python3 scripts/verify_bridge_mosquitto.py --broker-root broker --qos2
      - run: python3 scripts/verify_bridge_topology.py --broker-root broker

  bridge-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=0.39.0 --build-arg VCS_REF=${{ github.sha }} -t xmqr-client:ci .
      - run: test "$(docker run --rm --entrypoint /usr/local/bin/mqtt-client xmqr-client:ci --version)" = 'mqtt-client 0.39.0'
      - run: test "$(docker run --rm --entrypoint /usr/local/bin/mqtt-bridge xmqr-client:ci --version)" = 'mqtt-bridge 0.1.0 (xmqr-client 0.39.0)'
      - run: test "$(docker image inspect xmqr-client:ci --format '{{.Config.User}}')" = '10001:10001'
